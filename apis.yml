name: Nok Nok Labs
description: 'Nok Nok Labs is a passwordless and strong authentication vendor and a
  founding member of the FIDO Alliance, known for the Nok Nok S3 Authentication Suite
  that lets enterprises deploy FIDO-based (UAF/U2F/FIDO2/passkey) multi-factor and
  passwordless authentication across mobile and web. Its offering is an enterprise,
  server-side authentication platform sold to banks, telcos, and large organizations
  rather than a self-serve public API product. As of this enrichment pass the company
  has no independent public developer portal: the noknok.com domain (every path probed)
  301-redirects to OneSpan''s security platform at onespan.com/security, indicating
  its web presence has been consolidated under OneSpan. It was added to the API Evangelist
  network as a portfolio company of DCM Ventures.'
